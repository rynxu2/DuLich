server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:dulich}
    password: ${SPRING_DATASOURCE_PASSWORD:dulich_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: 30000
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:20000}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:dulich}
    password: ${SPRING_RABBITMQ_PASSWORD:dulich_secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Resilience4j Circuit Breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      tourService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      tourService:
        max-attempts: 3
        wait-duration: 1s
  timelimiter:
    instances:
      tourService:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

# SePay Payment Gateway (Sandbox)
sepay:
  merchant-id: ${SEPAY_MERCHANT_ID}
  secret-key: ${SEPAY_SECRET_KEY}
  api-key: ${SEPAY_API_KEY}
  bank-code: ${SEPAY_BANK_CODE:TPBank}
  account-number: ${SEPAY_ACCOUNT_NUMBER}
  success-url: ${SEPAY_SUCCESS_URL:dulich://payment/success}
  cancel-url: ${SEPAY_CANCEL_URL:dulich://payment/cancel}
  qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}

# VTC Pay Payment Gateway (Sandbox - Card Payment)
vtcpay:
  website-id: ${VTCPAY_WEBSITE_ID:200823}
  security-code: ${VTCPAY_SECURITY_CODE:cd20c242BE77d8de732268902349200515e01e0e6e2bdf1aff5feff725BEf077}
  receiver-account: ${VTCPAY_RECEIVER_ACCOUNT:0963465816}
  checkout-url: ${VTCPAY_CHECKOUT_URL:https://alpha1.vtcpay.vn/portalgateway/checkout.html}
  return-url: ${VTCPAY_RETURN_URL:http://localhost:8080/api/payments/vtcpay/return}
  currency: VND
  language: vi
